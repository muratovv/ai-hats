[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-hats-opencode"
version = "0.1.0"
description = "OpenCode surface plugin for the ai-hats framework."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "muratovv", email = "f@muratovv.me" }, # ai-hats: allow-secret
]
keywords = ["opencode", "provider", "surface", "ai-hats", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "ai-hats>=0.15.0",
]

[project.entry-points."ai_hats.providers"]
opencode = "ai_hats_opencode:OpenCodeProvider"

[project.urls]
Homepage = "https://github.com/muratovv/ai-hats"
Repository = "https://github.com/muratovv/ai-hats"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_hats_opencode"]

[tool.uv.sources]
ai-hats = { workspace = true }
