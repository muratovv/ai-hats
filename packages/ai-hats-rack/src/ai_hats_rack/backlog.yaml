# Packaged default: the tasks backlog. Kernel CONTRACT, not user config (ADR-0017).
name: tasks
prefix: HATS

extensions:
  - frozen-integrity

fsm:
  initial: brainstorm
  states:
    - { name: brainstorm }
    - { name: plan, on_enter: [{ name: plan-scaffold, priority: 30 }] }
    - { name: execute, on_enter: [{ name: plan-gate, priority: 10 }] }
    - { name: document }
    - { name: review }
    - { name: done, on_enter: [{ name: stamp-lifecycle, priority: 12 }] }
    - { name: blocked }
    - { name: failed }
    - { name: cancelled, on_enter: [{ name: stamp-lifecycle, priority: 12 }] }
  edges:
    - { from: brainstorm, to: plan }
    - { from: brainstorm, to: blocked }
    - { from: brainstorm, to: cancelled }
    - { from: plan, to: execute }
    - { from: plan, to: blocked }
    - { from: plan, to: cancelled }
    - { from: execute, to: execute, name: reclaim }
    - { from: execute, to: document }
    - { from: execute, to: blocked }
    - { from: execute, to: failed }
    - { from: execute, to: cancelled }
    - { from: document, to: review }
    - { from: document, to: blocked }
    - { from: document, to: cancelled }
    - { from: review, to: execute }
    - { from: review, to: done }
    - { from: review, to: failed }
    - { from: review, to: cancelled }
    - { from: blocked, to: brainstorm }
    - { from: blocked, to: plan }
    - { from: blocked, to: execute }
    - { from: blocked, to: document }
    - { from: blocked, to: cancelled }
    - { from: failed, to: brainstorm }
    - { from: failed, to: cancelled }
    - { from: done, to: execute, name: reopen, skip: [plan-gate], handlers: [{ name: clear-lifecycle, priority: 12 }] }

links:
  kinds:
    - { name: parent_task, arity: one, inverse: children, read: [{ name: parent-context }], read_docs: [plan.md] }
    - { name: depends_on, arity: many, aliases: [depends], inverse: blocks, read_docs: [summary.md, retro.md] }
    - { name: related, arity: many, inverse: related, read_docs: [summary.md, retro.md] }
    - { name: see_also, arity: many, inverse: see_also, read_docs: [summary.md, retro.md] }
    - { name: folded_into, arity: one, aliases: [fold], inverse: subsumes, read_docs: [summary.md] }
    - { name: children, derived: true, inverse: parent_task }
    - { name: blocks, derived: true, inverse: depends_on }
    - { name: subsumes, derived: true, inverse: folded_into }

fields:
  - { name: description, type: str, default: "" }
  - { name: priority, type: str, default: medium, choices: [low, medium, high, critical] }
  - { name: assignee, type: str, default: "" }
  - { name: reviewer, type: str, default: user }
  - { name: role, type: str, default: "" }
  - { name: tags, type: list, default: [] }
  # HATS-1275: the two state-conditional gates. An administrative close must
  # record why (the audit trail rule_backlog_discipline reads); the review
  # accomplished-work summary is meaningless on any other edge.
  - { name: resolution, type: str, default: "", emit: when-set, required_on: [cancelled] }
  - { name: completed_at, type: str, default: "", emit: when-set }
  - { name: final_state, type: str, default: "", emit: when-set, write_on: [review] }
  - { name: work_policy, type: str, default: "", emit: when-set }
