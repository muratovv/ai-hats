name: dev::python
composition:
  traits: []
  rules:
    - dev_rule_silent_fallback
  skills:
    - py-security-lint
    - comment-length-lint
injection: |
  ## PYTHON DEVELOPMENT

  ### Standards
  - Python 3.11+ with type hints
  - Use pyproject.toml for project configuration
  - Prefer dataclasses or Pydantic for data models
  - Use pathlib.Path over os.path
  - Format with ruff, lint with ruff

  ### Testing
  - pytest as test framework
  - Tests live in a dedicated `tests/` directory — either mirroring `src/`, or co-located with the module it covers. Pick one per project and hold it.
  - Integration tests preferred over excessive mocking

  ### Dependencies
  - Minimal dependencies — stdlib first
  - Pin versions in pyproject.toml
  - Use venv for isolation

  ### Error handling
  A fallback that cannot report is forbidden: if an `except` body neither raises nor reports (log, domain call, or a returned value carrying the error), it hides the failure from every test and log. Breadth of the catch is not the defect — silence of the body is. Declare a deliberate one with `# silent-ok: <reason>`, and never add a fallback without a test that exercises it. See rule `dev_rule_silent_fallback`.
