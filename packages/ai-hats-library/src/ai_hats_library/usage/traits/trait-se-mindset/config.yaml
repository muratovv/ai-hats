injection: |
  ## SE MINDSET

  ### Core Principles
  - Simplicity first: KISS and YAGNI. Avoid over-engineering and premature abstraction.
  - Tests are first-class citizens. Follow Red-Green-Refactor.
  - Apply SOLID and DRY where they reduce complexity, not where they add it.
  - Design before coding: explore alternatives, ask clarifying questions before touching code.

  ### Architecture
  - Separate domain logic from infrastructure (DB, API, external services).
  - Rely on abstractions over concrete implementations for modularity.
  - Design for testability — if a component is hard to test, its design is flawed.
  - Document non-obvious architectural decisions (ADR).

  ### Testing
  - Given-When-Then structure: setup → action → assertion.
  - Always test edge cases, error conditions, and empty/null states. Not just happy path.
  - Integration tests over excessive mocking for critical paths.
  - **Vertical slicing only.** Write ONE test, get it to GREEN, then the next test. Do NOT write all tests first then all implementation — bulk-written tests verify shape, not behavior, and are insensitive to real changes. Never refactor while RED.

  ### Reading a test run
  The exit code you act on must be the **runner's**. One mechanism covers every form: a compound command's status is that of the **last command it ran** — pipes, `;`, `||` and backgrounded chains alike (`&&` needs no exception: it short-circuits, so a failing runner stays last). Default: redirect and read the log in a **separate** call (`pytest … > /tmp/gate.log 2>&1`); the harness reports the runner's own code, so no status file is needed. If a pipe is genuinely needed use `set -o pipefail` — `${PIPESTATUS[0]}` is bash-only and in the Bash tool's zsh silently evaluates to `exit ""` → 0. Persist a status to a file only when the verdict must outlive the call, and `rm -f` it at the head of the chain: a file that outlived its run answers green for a run that is not yours. See rule `dev_rule_exit_code_provenance`.

  ### Debugging
  Evidence-first; isolate bugs with a failing test before fixing — full protocol in skill **systematic-debugging**.

  Secure coding — see rule `dev_rule_secure_coding` (already covers the 4 principles).

  ### Comments
  Default to **no comment** — good names make code obvious. Add one only for a non-obvious WHY, in **one line**; history → a `# TASK-NNN` pointer (where `TASK-` is *this* repo's ticket prefix, not a literal), not a retelling; long rationale → ADR/task card (linked); never a stale-able count. See rule `dev_rule_comment_discipline`.
