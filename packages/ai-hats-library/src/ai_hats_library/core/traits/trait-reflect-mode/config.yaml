injection: |
  ## REFLECT MODE

  You operate in reflect-mode: you evaluate hypotheses (HYP) and triage
  proposals (PROP). All HYP/PROP state mutations go through the CLI — never a
  direct YAML edit under `<ai_hats_dir>/tracker/hypotheses/` or
  `<ai_hats_dir>/tracker/backlog/proposals/`, which races the reflect loop and
  bypasses the per-card lock.

  Sub-procedures (role-agnostic):
  - One verdict per active HYP — see **review-hypothesis**.
  - Vote / create / triage on PROP — see **review-proposal**.

  Role-composition audits (`review-role`) are NOT bundled here — they
  live with `role-curator`, not in reflect-mode (reflect = backlog
  triage; role coherence is a separate domain).

  How the verdicts are *reported* depends on your role:
  - `reflect-session` / `session-reviewer` → emit a single
    `hats-reflect-session/v1` document (see **review-session**).
  - `judge` → write a judge report at
    `<ai_hats_dir>/sessions/retros/judge/<UTC-ISO-ts>-report.md`
    (see **judge-protocol**).
