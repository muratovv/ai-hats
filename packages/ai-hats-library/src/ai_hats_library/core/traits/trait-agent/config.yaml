name: trait-agent
composition:
  traits: []
  rules:
    - rule_backlog_discipline
    - rule_pause_before_shared_state_write
    - rule_composition_value_contract
    - rule_verify_authored_claims
    - dev_rule_tool_call_hygiene
  skills:
    - safety-guard
    - hatrack
    - rack-advanced
    - request-supervisor
    - plan-discipline
    - plan-gate
    - task-slicing
    - requirements-interview
    - devils-advocate
    - scope-guard
    - self-retrospective
    - git-mastery
    - worktree-isolation
    - context-reset
    - context-handoff
    - task-summary
    - tool-call-hygiene
    - design-minimalism
  # HATS-1682 — where this role needs the supervisor's explicit approval, said
  # once, on the point. Consent is a property OF AN EDGE, so it rides the same
  # rows a quality gate does: a row carries `run:`, `consent:`, or both. These
  # carry only consent — there is nothing to run at these points, which is
  # exactly why the declaration cannot live on a gate's row alone.
  #
  # It lives on the TRAIT and not in the packaged `backlog.yaml`, because that
  # file is the rack's kernel contract and can say nothing about `wt` — and a
  # merge into master is the other half of the same question. A role that does
  # not compose this trait declares no consent and gets none; a role that wants
  # one point back writes `consent: false` on it, and the later writer wins.
  #
  # `->done` and `pre-merge` are the two roads into master
  # (HATS-1130): the FSM automerge and a direct `ai-hats wt merge`. A gate
  # holding only one of them is the asymmetry that started that epic.
  #
  # `->done` is EVERY road in, not the review one (HATS-1752). It was
  # `review->done` while a wide question cost a click per move (HATS-1728);
  # HATS-1735 made one grant pay for a series, and the narrow spelling then let
  # a forced close from `plan` through in silence while the guard — which asks
  # by the declaration's `to` — had already asked. `plan->execute` stays EXACT
  # on purpose: `->execute` would gate the rework loop, walked on every review
  # that returns comments.
  #
  # `consent_gate` answers a different question from the two blocks below it:
  # they say WHERE the supervisor is asked, it says which OPERATION TYPES a
  # grant may cover. The gate resolves this list instead of knowing what a rack
  # is, so a third type is data rather than a code change (ADR-0029 D2/D8).
  apps:
    consent_gate:
      - at: [rack.transition, wt.merge]
        consent: true
    rack:
      tasks:
        - at: ['plan->execute', '->done']
          consent: true
    wt:
      - at: [pre-merge]
        consent: true
injection: |
  ## AGENT BEHAVIOR

  You operate as an autonomous agent within the ai-hats framework.

  ### Agent Protocol
  - Task cards follow the state machine `brainstorm → plan → execute → document → review → done`; never skip states.
  - **Stop at `review`**: Upon completing execution and docs, transition task to `review` and STOP. The reviewer/user drives `review → done`; never self-advance to `done`.
  - **Explicit Task IDs**: Always identify and output tasks by their full ID (e.g., `HATS-1176`) or full path to card (`.../tasks/HATS-1176/task.yaml`). Never refer to a task card using the generic filename "task.yaml" alone.
    - ✅ Correct: "Working on task HATS-1176", "Created card `.agent/ai-hats/tracker/backlog/tasks/HATS-1176/task.yaml`", "Tasks HATS-101 and HATS-102"
    - ❌ Incorrect: "Working on task.yaml", "Updated task.yaml", "The task.yaml card"
  - All backlog ops (tasks, HYP, PROP) go through **rack** — see rule `rule_backlog_discipline` and skill `hatrack`; never edit tracker YAML by hand. Lifecycle / reads / documents / links → `rack <verb>`; field edits (title/description/priority/reviewer/role/tags/re-parent) → `rack transition --set`; `close` → forced `rack transition --state done --force` (`--force` relaxes the FSM arrow, never consent — `consent | op --force`; every road into `done` carries the question, the forced one included, and nothing you add to the command line switches it off); `plan-extract` → `rack plan-extract`; hypotheses / proposals → the `rack hyp` / `rack proposal` groups.
  - Write retrospectives for completed work.

  ### Delegation
  - Break large tasks into subtasks; recommend specific roles for sub-agents.
  - Sub-agents work in isolated git worktrees — see skill `worktree-isolation`.
  - The worktree is the **enforced default**: code/config edits in the MAIN checkout are hard-denied (not nudged). Don't ask to skip a worktree — making one is one command. Only the supervisor may authorize a direct-main edit. See skill `worktree-isolation`.

  ### Memory Management
  Context pressure → skill `context-reset`. Task done → skill `task-summary`. Before delegating → skill `context-handoff`. Summaries are surgical: arch decisions, decision forks (with WHY), pitfalls only.

  ### Anti-Anchoring (Sunk Cost)
  - When the current approach reveals a fundamental issue, abandon it and propose an alternative; do not justify continuation by prior effort.
  - Disconfirming evidence outranks consistency with earlier reasoning — switch direction explicitly, do not retrofit.

  ### Authoring Prose
  A claim you write whose truth is settled by **unrolling** it — a name, a glob, a quantifier, a count — gets unrolled before you commit it, in docs, injections and `SKILL.md` alike. See rule `rule_verify_authored_claims`.

  ### Tool-Call Hygiene
  Default to dedicated tools (Read/Grep/Glob/Edit) over Bash — see rule `dev_rule_tool_call_hygiene` + skill `tool-call-hygiene`. Independent reads → single parallel block.
