name: ai-hats-framework
composition:
  traits: []
  # The decision tree lives in the `library-layer-split` skill, owned by the
  # role-curator domain (HATS-1834; was rule_core_vs_usage_split). Roles that
  # compose this trait get layer-awareness always-on and no formal constraint —
  # non-trivial library work hands off to role-curator.
  rules: []
  skills: []
injection: |
  ## AI-HATS FRAMEWORK

  This project (or its tooling) is composed via ai-hats. The shipped library is
  layered, lowest priority first — a later layer overrides a name from an
  earlier one:

  - **`core/`** — engine fundament. System roles, base traits, global rules,
    foundational skills, pipelines. Universal; without it nothing runs.
  - **`usage/`** — opinionated content catalog. Domain roles, `dev::` / `env::`
    traits, opt-in skills. Take what fits, ignore the rest.
  - **`ai-hats-dev/`** — the layer the ai-hats repository wears to develop
    itself. Present only in that checkout; nothing here is meant for a
    consuming project.

  Above all three sit your own overrides (`~/.ai-hats/`, a project's
  `libraries/`), which win by the same last-wins rule.

  When creating a rule / skill / trait, the layer is a **plan-stage** answer,
  not a post-hoc one: expand skill `library-layer-split` for the decision tree.
  Ownership of library curation lives with the `role-curator` role — hand off
  non-trivial library changes there.
